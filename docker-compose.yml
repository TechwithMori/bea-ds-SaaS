services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bea_drops}
      POSTGRES_USER: ${POSTGRES_USER:-bea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bea}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bea} -d ${POSTGRES_DB:-bea_drops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: python manage.py runserver 0.0.0.0:8010
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.local
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: celery -A core worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.local
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
